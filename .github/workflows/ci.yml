name: OceanEmbed CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Audit
        run: python scripts/data/data_audit.py

      - name: Run Build
        run: npm run build

      - name: Verify Dist Artifacts
        run: |
          test -f dist/index.html
          test -f dist/api/metadata.json
          test -f dist/api/argo_matchups.json
          test -f dist/_redirects
          test -f dist/OceanEmbed_Mathematical_and_Data_Specifications.pdf
